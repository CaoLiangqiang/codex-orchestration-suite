name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/sync_suite_resources.py --check
      - run: python scripts/validate_skills.py skills/orchestrate-project-sessions skills/team-mode
      - run: python -m unittest discover -s tests -p "test_*.py" -v
